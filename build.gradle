tasks.register("verifyCoprocessingAssets") {
    dependsOn addonJar
    doLast {
        def approved = [
            "assets/appliedtiers/textures/block/crafting/advanced/accelerator_light.png": "a9333c4ca5a7c709739daf64982d22b1c84e8f10c6ba4bd79fa070d0d8d96f27",
            "assets/appliedtiers/textures/block/crafting/advanced/accelerator.png": "627f31fd1f8f77744832e013f7f2115c473e917945ca4a1580f65931452970f9",
            "assets/appliedtiers/textures/block/crafting/elite/accelerator_light.png": "31b83ebf5d5c4b6ab8d6a9e046aa3c2f4eb650aaa1493804284163260a1a8aad",
            "assets/appliedtiers/textures/block/crafting/elite/accelerator.png": "e69a0bbf532c1b3fce2ff3a2a7ae7d78a8488dd0799b846f88800af21627f0bd",
            "assets/appliedtiers/textures/block/crafting/ultimate/accelerator_light.png": "6b1fa9f76fe525f6564c24619534b2be2997f03f5ac8be75eef1ccea46f47dae",
            "assets/appliedtiers/textures/block/crafting/ultimate/accelerator.png": "48e156d53b9b4415cd863739100a96a7a3dad611bf63285d204924fc2de25c5b"
        ]
        new java.util.zip.ZipFile(addonJar.get().archiveFile.get().asFile).withCloseable { jar ->
            approved.each { path, expected ->
                def entry = jar.getEntry(path)
                if (!entry) throw new GradleException("Missing coprocessor texture: " + path)
                def bytes = jar.getInputStream(entry).withCloseable { it.bytes }
                def actual = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString()
                if (actual != expected) throw new GradleException("Incorrect approved texture: " + path)
                def image = javax.imageio.ImageIO.read(new ByteArrayInputStream(bytes))
                assert image.width == 16 && image.height == 16 && image.colorModel.hasAlpha()
            }
            def readJson = { path ->
                def entry = jar.getEntry(path)
                if (!entry) throw new GradleException("Missing coprocessor resource: " + path)
                jar.getInputStream(entry).withCloseable { new groovy.json.JsonSlurper().parse(it) }
            }
            ["advanced", "elite", "ultimate"].each { tier ->
                def id = tier + "_crafting_accelerator"
                def assets = "assets/appliedtiers/"
                def model = "appliedtiers:block/" + id
                def states = readJson(assets + "blockstates/" + id + ".json")
                assert states.variants["formed=false"].model == model
                assert states.variants["formed=true"].type == "appliedtiers:crafting_cube"
                assert states.variants["formed=true"].tier == tier
                assert readJson(assets + "items/" + id + ".json").model.model == model
                assert readJson(assets + "models/block/" + id + ".json").textures.all == "appliedtiers:block/crafting/" + tier + "/accelerator"
                assert readJson("data/appliedtiers/recipe/" + id + ".json").result.id == "appliedtiers:" + id
                assert readJson("data/appliedtiers/loot_table/blocks/" + id + ".json").pools[0].entries[0].name == "appliedtiers:" + id
                assert readJson("data/minecraft/tags/block/mineable/pickaxe.json").values.contains("appliedtiers:" + id)
            }
        }
        logger.lifecycle("Verified all six approved coprocessing textures and packaged models")
    }
}
tasks.named("check") { dependsOn "verifyCoprocessingAssets" }

tasks.register("verifyLicenseNotices") {
    dependsOn addonJar
    doLast {
        new java.util.zip.ZipFile(addonJar.get().archiveFile.get().asFile).withCloseable { jar ->
            ["META-INF/AE2-LICENSE.txt", "META-INF/AE2-API-LICENSE.txt", "META-INF/APPLIED-TIERS-NOTICE.md"].each { path ->
                if (jar.getEntry(path) == null) throw new GradleException("Missing license notice: " + path)
            }
            def license = jar.getInputStream(jar.getEntry("META-INF/AE2-LICENSE.txt")).withCloseable { it.getText("UTF-8") }
            assert license.contains("GNU LESSER GENERAL PUBLIC LICENSE") && license.contains("GNU GENERAL PUBLIC LICENSE")
            def metadata = jar.getInputStream(jar.getEntry("META-INF/neoforge.mods.toml")).withCloseable { it.getText("UTF-8") }
            assert metadata.contains('license="LGPL-3.0-or-later"')
        }
        logger.lifecycle("Verified LGPL/GPL texts, API attribution and mod license metadata")
    }
}
tasks.named("check") { dependsOn "verifyLicenseNotices" }
