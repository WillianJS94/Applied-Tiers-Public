name: Build Applied Tiers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build addon JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Validate packaged providers, assemblers and resources
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR_PATH="build/libs/appliedtiers-${MOD_VERSION}.jar"
          test -f "$JAR_PATH"
          jar tf "$JAR_PATH" > build/packaged-files.txt
          grep -Fx "io/github/willianjs94/appliedtiers/AppliedTiers.class" build/packaged-files.txt
          grep -Fx "META-INF/neoforge.mods.toml" build/packaged-files.txt
          test -z "$(sort build/packaged-files.txt | uniq -d)"
          for tier in advanced elite ultimate; do
            grep -Fx "assets/ae2/screens/appliedtiers_${tier}_molecular_assembler.json" build/packaged-files.txt
            grep -Fx "assets/ae2/textures/guis/appliedtiers_${tier}_molecular_assembler.png" build/packaged-files.txt
            for path in blockstates items models/block; do
              grep -Fx "assets/appliedtiers/${path}/${tier}_molecular_assembler.json" build/packaged-files.txt
            done
            grep -Fx "assets/appliedtiers/textures/block/${tier}_molecular_assembler.png" build/packaged-files.txt
            grep -Fx "data/appliedtiers/recipe/${tier}_molecular_assembler.json" build/packaged-files.txt
            grep -Fx "data/appliedtiers/loot_table/blocks/${tier}_molecular_assembler.json" build/packaged-files.txt
            grep -Fx "assets/ae2/screens/appliedtiers_${tier}.json" build/packaged-files.txt
            grep -Fx "assets/ae2/textures/guis/appliedtiers_${tier}_compact.png" build/packaged-files.txt
            grep -Fx "assets/appliedtiers/blockstates/${tier}_pattern_provider.json" build/packaged-files.txt
            grep -Fx "assets/appliedtiers/items/${tier}_pattern_provider.json" build/packaged-files.txt
            grep -Fx "data/appliedtiers/recipe/${tier}_pattern_provider.json" build/packaged-files.txt
            grep -Fx "data/appliedtiers/loot_table/blocks/${tier}_pattern_provider.json" build/packaged-files.txt
          done
          for class in block/ParallelAssemblerBlock blockentity/ParallelAssemblerBlockEntity menu/ParallelAssemblerMenu client/ParallelAssemblerScreen client/ParallelAssemblerRenderer network/AssemblerAnimationPayload; do
            grep -Fx "io/github/willianjs94/appliedtiers/${class}.class" build/packaged-files.txt
          done
          for tier in Advanced Elite Ultimate; do
            grep -Fx "io/github/willianjs94/appliedtiers/blockentity/${tier}PatternProviderBlockEntity.class" build/packaged-files.txt
          done

      - name: Upload compiled addon
        uses: actions/upload-artifact@v4
        with:
          name: appliedtiers-jar
          path: build/libs/*.jar
          if-no-files-found: error
